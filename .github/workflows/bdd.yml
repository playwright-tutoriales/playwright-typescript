name: BDD tests
on:
  workflow_dispatch:
  push:
    paths: ['02-bdd-arquitectura/**', '.github/workflows/bdd.yml']
  pull_request:
    paths: ['02-bdd-arquitectura/**', '.github/workflows/bdd.yml']
permissions:
  contents: read
concurrency:
  group: bdd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-bdd-arquitectura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-bdd-arquitectura/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          ENV: qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes
          path: 02-bdd-arquitectura/reports
